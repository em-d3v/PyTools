name: "build"
on:
    # push:
    #     branches: [$default-branch]
    workflow_call:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: "Setup Python"
              uses: actions/setup-python@v6
              with:
                python-version: '3.13t'
            - run: pip install -r requirements.txt
            - run: python scripts/runner.py